version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: reviewai_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reviewai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-reviewai_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviewai} -d ${POSTGRES_DB:-reviewai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - reviewai_net

  redis:
    image: redis:7-alpine
    container_name: reviewai_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - reviewai_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: reviewai_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-reviewai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reviewai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - reviewai_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: reviewai_worker_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-reviewai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reviewai_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - reviewai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: reviewai_frontend_prod
    restart: always
    depends_on:
      - backend
    networks:
      - reviewai_net

  nginx:
    image: nginx:alpine
    container_name: reviewai_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - reviewai_net

networks:
  reviewai_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
